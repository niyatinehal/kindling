name: wellness-platform-test

services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wellness_test
    ports:
      - "54329:5432"
    # No volume: every run starts from an empty database on purpose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wellness_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Backs the photo-parsing job queue. Like the database, no volume: every run
  # starts empty. The port avoids 6379 so it never collides with a Redis
  # already running on the machine.
  test-redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
