name: wellness-platform

services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      # The container always listens on 3000; remap on the host instead.
      PORT: 3000
      # Unused in Sprint 0. Wired now so the topology is correct before it is
      # load-bearing — Sprint 1 connects to this.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
