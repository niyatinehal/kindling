name: wellness-platform

services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      # The container always listens on 3000; remap on the host instead.
      PORT: 3000
      # Pooled connection, used by the app at runtime. Locally there is no
      # pooler, so this matches DIRECT_URL below.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      # Direct connection. The app itself never reads this, but
      # src/config/env.ts requires it at boot (prisma/seed.ts does use it),
      # so it must be forwarded here too or the container exits immediately.
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      # src/config/env.ts requires this at boot too — the JWT issuer and JWKS
      # endpoint are derived from it. Same failure mode as DATABASE_URL/
      # DIRECT_URL above if it isn't forwarded: the container exits
      # immediately and, under `restart: unless-stopped`, crash-loops.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
    extra_hosts:
      # Linux's Docker Engine doesn't resolve host.docker.internal natively;
      # this makes it resolve to the host gateway. Docker Desktop
      # (macOS/Windows) already resolves it, so this is a harmless no-op there.
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
